    </header>
  
    <div class="dashboard-wrap">
    <h2>What would you like to do?</h2>
    <div class="dashboard-options">
      <a href="post.html" class="dashboard-card">
        <h3>Post an Item</h3>
        <p>Report something you lost or found on campus.</p>
      </a>
      <a href="board.html" class="dashboard-card">
        <h3>Claim / Search</h3>
        <p>Browse the board to find or claim an item.</p>
      </a>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");

    if (!token) {
      window.location.replace("login.html");
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("userName");
      localStorage.removeItem("userEmail");
      window.location.replace("login.html");
    });
  </script>
  <script src="theme.js"></script>

  </script>

  <footer><mark>CampusFindy — built by students, for students.</mark>
