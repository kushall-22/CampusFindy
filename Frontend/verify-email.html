<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Email - CampusFindy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="CampusFindly.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-bg">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo" aria-hidden="true"></span>
      <span>ampusFindy</span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="login.html">Log In</a>
      <button type="button" class="btn btn-nav theme-toggle" id="themeToggle">☾ Dark</button>
    </nav>
  </header>

  <main class="login-container verification-container">
    <h2>Verify your email</h2>
    <p class="verification-intro" id="verificationIntro">
      Enter the 6-digit code we sent to your email.
    </p>
    <form id="verifyEmailForm" novalidate>
      <label class="verification-email-fallback" id="emailFallback" for="emailInput" hidden>
        Email address
        <input type="email" id="emailInput" placeholder="College Email" autocomplete="email">
      </label>

      <fieldset class="verification-code-field">
        <legend>Verification code</legend>
        <div class="verification-code-inputs" id="codeInputs" role="group" aria-label="6-digit verification code">
          <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Digit 1" required>
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" required>
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" required>
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" required>
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" required>
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" required>
        </div>
      </fieldset>
      <p class="verification-expiry">Code expires in 10 minutes.</p>
      <button type="submit" class="btn btn-primary" id="verifyButton">Verify</button>
    </form>
    <div class="verification-secondary">
      <p>Didn’t receive a code? <button type="button" class="verification-resend" id="resendCodeBtn">Resend code</button></p>
      <p><a href="login.html">← Back to sign in</a></p>
    </div>
  </main>

  <footer>
    <mark>CampusFindy — built by students, for students.</mark>
  </footer>

  <script src="theme.js"></script>
  <script src="api-config.js"></script>
  <script src="verify-email.js"></script>
</body>
</html>
