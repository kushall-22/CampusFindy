<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - CampusFindy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="CampusFindly.ico">
  <link rel="stylesheet" href="style.css">
  <script>
    if (!localStorage.getItem("token")) window.location.replace("login.html");
  </script>
</head>
<body class="page-bg">
  <header class="topbar">
    <a class="brand" href="dashboard.html">
      <span class="brand-logo" aria-hidden="true"></span>
      <span>ampusFindy</span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <button type="button" class="btn btn-nav theme-toggle" id="themeToggle">☾ Dark</button>
    </nav>
  </header>

  <main class="login-container">
    <h2>My Profile</h2>
    <p id="profileStatus" role="status" aria-live="polite">Loading profile…</p>
    <div id="profileDetails" hidden>
      <div class="field">
        <label for="profileName">Name</label>
        <input id="profileName" type="text">
      </div>
      <div class="field">
        <label for="profileEmail">Email</label>
        <input id="profileEmail" type="email" readonly>
      </div>
      <div class="field">
        <label for="profileRole">Account type</label>
        <input id="profileRole" type="text" readonly>
      </div>
      <button class="btn btn-primary" id="updateProfileBtn">Update Profile</button>
    </div>
  </main>

  <footer>
    <mark>CampusFindy — built by students, for students.</mark>
    <div class="watermark"><i>kushall</i></div>
  </footer>

  <script src="theme.js"></script>
  <script src="api-config.js"></script>
  <script src="profile.js"></script>
</body>
</html>
