<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an Item — CampusFindy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="CampusFindly.ico">
  <link rel="stylesheet" href="style.css">
  <script>
    if (!localStorage.getItem("token")) window.location.replace("login.html");
  </script>
</head>
<body class="page-bg">

  <header class="topbar">
    <a class="brand" href="dashboard.html">
      <span class="brand-logo" aria-hidden="true"></span>
      <span>ampusFindy</span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <button type="button" class="btn btn-nav theme-toggle" id="themeToggle">☾ Dark</button>
      <div class="menu-wrap">
        <button type="button" class="btn menu-btn" id="menuBtn" aria-label="More options" aria-haspopup="true" aria-expanded="false">⋮</button>
        <div class="menu-dropdown" id="menuDropdown" hidden>
          <a class="menu-item" href="index.html">Home</a>
          <a class="menu-item" href="dashboard.html">Dashboard</a>
          <a class="menu-item" href="profile.html">Profile</a>
          <button type="button" class="btn menu-item" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="form-wrap">
    <h1>Report an item</h1>
    <p class="sub">Fill in as much detail as you can — it makes matching lost and found items much easier.</p>

    <form id="itemForm">
      <div class="status-picker">
        <label data-status="lost">
          <input type="radio" name="status" value="lost" checked>
          <span>I lost something</span>
        </label>
        <label data-status="found">
          <input type="radio" name="status" value="found">
          <span>I found something</span>
        </label>
      </div>

      <div class="field">
        <label for="title">Item name</label>
        <input type="text" id="title" placeholder="e.g. Blue water bottle" required>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category">
          <option value="electronics">Electronics</option>
          <option value="bag">Bag / backpack</option>
          <option value="id-card">ID card / documents</option>
          <option value="clothing">Clothing / accessories</option>
          <option value="books">Books / stationery</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Color, brand, any identifying marks..." required></textarea>
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Library, 2nd floor" required>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" required>
      </div>

      <div class="field">
        <label for="contactInfo">Your contact info</label>
        <input type="text" id="contactInfo" placeholder="Email or phone number" required>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">Post to CampusFindy</button>
    </form>
  </div>

  <footer>
    <mark>CampusFindy — built by students, for students.</mark>
    <a class="footer-feedback" href="feedback.html">Share feedback</a>
    <div class="watermark"><i>kushall</i></div>
  </footer>

  <script src="theme.js"></script>
  <script src="api-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
