<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a New Password - CampusFindy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="CampusFindly.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-bg">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo" aria-hidden="true"></span>
      <span>ampusFindy</span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="login.html">Log In</a>
      <button type="button" class="btn btn-nav theme-toggle" id="themeToggle">☾ Dark</button>
    </nav>
  </header>

  <main class="login-container">
    <h2>Choose a new password</h2>
    <p id="statusMessage" role="status" aria-live="polite"></p>
    <form id="resetPasswordForm">
      <div class="password-field">
        <input
          type="password"
          id="newPassword"
          placeholder="New password (at least 8 characters)"
          autocomplete="new-password"
          minlength="8"
          maxlength="72"
          required
        >
        <button type="button" class="btn btn-ghost password-toggle" data-toggle-password aria-controls="newPassword" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <button type="submit" class="btn btn-primary" id="resetPasswordButton">Reset password</button>
    </form>
    <p><a href="forgot-password.html">Request another reset link</a></p>
  </main>

  <footer>
    <mark>CampusFindy — built by students, for students.</mark>
  </footer>

  <script src="theme.js"></script>
  <script src="api-config.js"></script>
  <script src="password-toggle.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
