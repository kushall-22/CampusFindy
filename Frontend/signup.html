<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up - Campus Findy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/x-icon" href="CampusFindly.ico">
<link rel="stylesheet" href="style.css">
<body class="page-bg">
</body>
</head>
<body>

    <!--<header class="topbar">
    <a class="brand" href="index.html">
      <img src="./CampusFindly-removebg-preview1.png" alt="CampusFindy Logo" class="brand-logo">

      <header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-logo" aria-hidden="true"></span>
    <span>ampusFindy</span>
  </a>

    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <button type="button" class="theme-toggle" id="themeToggle">☾ Dark</button>
    </nav>
    </header>
    
  <div class="login-container">
    <h2>Create Account</h2>

    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="College Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
    <p id="errorMsg" style="color:red;"></p>
  </div>

  <script>
    const signupForm = document.getElementById("signupForm");
    const errorMsg = document.getElementById("errorMsg");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:5000/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorMsg.textContent = data.message || "Signup failed";
          return;
        }

        // Signup successful, redirect to login
        window.location.href = "login.html";
      } catch (error) {
        errorMsg.textContent = "Could not reach server. Is it running?";
      }
    });
  </script>
  <script src="theme.js"></script>
  
  <footer><mark>CampusFindy — built by students, for students.</mark>
    <div class="watermark">
      <i>kushall</i>
    </div>
  </footer>

</body>
</html>
